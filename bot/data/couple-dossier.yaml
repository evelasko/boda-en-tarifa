  enrique:
    canonical: "Enrique"
    friends: "Henry"
    family: "Kike"
  manuel:
    canonical: "Manuel"
    friends: "Manu"
    family: "Manolo"

# ─────────────────────────────────────────────────
# Relationship timeline (most facts predate Thora — render as hearsay)
# ─────────────────────────────────────────────────
