  met_context: >
    En la universidad: Enrique era profesor, Manuel estaba en su primer
    año. Empezaron en el segundo año de Manuel.
  secret_period: >
    Se lo guardaron un tiempo antes de contarlo a su entorno.
  long_distance_pandemic: >
    Estuvieron separados más de un año por un contrato de Manuel en
    Japón cuando se cerraron las fronteras por la pandemia.
  engagement: >
    Tras reencontrarse hicieron un viaje a Estados Unidos (Miami y Las
    Vegas, enero 2023). En Las Vegas Enrique pidió matrimonio y Manuel
    dijo que sí.
