# Tarifa Concierge Guide
#
# Curated knowledge Thora uses to recommend things to do for guests
# arriving early or exploring the area. Source-of-truth for the
# `lookup_tarifa_guide` tool (see 07-knowledge-base.md).
#
# FORMAT — each item is a dict with:
#   name             : short display name (string)
#   category         : one of [beaches, restaurants, kite_wind, water,
#                              sightseeing, day_trips, whale_watching,
#                              walking, nightlife, family]
#   area             : rough location ("Tarifa town", "Bolonia", etc.)
#   description      : 1-2 lines, factual, no marketing fluff
#   contact          : optional — phone / web / reservation hint
#   personal_note    : optional — Thora may quote ("mi humano Manuel dice...")
#   tarifa_specific  : bool — true if Tarifa-area, false for day trips
#   tags             : optional array of free-form tags for filtering
#
# OPERATOR FILL-IN — items marked "TODO" need Enrique/Manuel to complete.

version: 1
last_updated: "TODO"

# =============================================================================
# Beaches
# =============================================================================
beaches:
  - name: "Valdevaqueros"
    category: beaches
    area: "5-10 min en coche al norte de Tarifa"
    description: "Playa muy ancha, dunas espectaculares al final. Famosa para kite y windsurf. En días de Levante fuerte se llena de viento y arena."
    contact: ""
    personal_note: "TODO — Enrique/Manuel"
    tarifa_specific: true
    tags: ["kite", "windsurf", "ancha", "ventosa"]

  - name: "Bolonia"
    category: beaches
    area: "20 min en coche al norte"
    description: "Cala con dunas enormes y las ruinas romanas de Baelo Claudia justo al lado. Una de las playas más bonitas de España. Llegar pronto en verano."
    contact: ""
    personal_note: "TODO — Enrique/Manuel"
    tarifa_specific: false
    tags: ["ruinas", "dunas", "imprescindible"]

  - name: "Los Lances"
    category: beaches
    area: "junto a la urbanización de Tarifa"
    description: "La playa de la propia Tarifa. Buena para pasear, chiringuitos a tiro de piedra, accesible andando desde el centro y desde Tres Mares."
    contact: ""
    personal_note: "TODO — Enrique/Manuel"
    tarifa_specific: true
    tags: ["accesible", "chiringuitos", "urbana"]

  - name: "Punta Paloma"
    category: beaches
    area: "10 min en coche al norte de Tarifa"
    description: "Cala más recogida que Valdevaqueros, fondos de arena fina. Famosa por la 'arcilla' natural — la gente se la pone en la piel a modo de spa improvisado."
    contact: ""
    personal_note: "TODO — Enrique/Manuel"
    tarifa_specific: true
    tags: ["recogida", "arcilla", "fotogénica"]

