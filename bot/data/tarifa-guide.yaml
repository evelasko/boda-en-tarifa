# Sightseeing
# =============================================================================
sightseeing:
  - name: "Castillo de Guzmán el Bueno"
    category: sightseeing
    area: "Tarifa old town"
    description: "Castillo medieval del siglo X, vistas al estrecho. Entrada de pago. Visita rápida (~1h)."
    contact: ""
    personal_note: "TODO — Enrique/Manuel"
    tarifa_specific: true
    tags: ["historia", "rápido"]

  - name: "Mirador del Estrecho"
    category: sightseeing
    area: "10 min en coche al este, hacia Algeciras"
    description: "Mirador sobre el estrecho de Gibraltar. En días claros se ve perfectamente la costa de Marruecos."
    contact: ""
    personal_note: ""
    tarifa_specific: true
    tags: ["vistas", "fotogénico"]

  - name: "Baelo Claudia"
    category: sightseeing
    area: "Bolonia, 20 min en coche al norte"
    description: "Ruinas romanas espectaculares, junto a la playa de Bolonia. Entrada gratuita para ciudadanos UE. Visita 1.5–2h."
    contact: ""
    personal_note: "TODO — Enrique/Manuel"
    tarifa_specific: false
    tags: ["ruinas", "histórico"]

  - name: "Casco antiguo de Tarifa"
    category: sightseeing
    area: "Tarifa centro"
    description: "Callejear sin plan por el casco antiguo: Puerta de Jerez, plaza del Mesón, callejuelas blancas. Mejor al atardecer."
    contact: ""
    personal_note: "TODO — Enrique/Manuel"
    tarifa_specific: true

# =============================================================================
# Day trips
# =============================================================================
day_trips:
  - name: "Tánger (ferry desde Tarifa)"
    category: day_trips
    area: "Marruecos, ferry desde el puerto de Tarifa"
    description: "Ferry rápido (35-45 min) FRS o Inter Shipping, salidas frecuentes. Pasaporte obligatorio. Visitar la kasbah, comer en el zoco. Día completo."
    contact: "frs.es / intershipping.com"
    personal_note: ""
    tarifa_specific: false
    tags: ["frontera", "pasaporte"]

  - name: "Vejer de la Frontera"
    category: day_trips
    area: "40 min en coche al norte"
    description: "Pueblo blanco encaramado en un cerro. Casco histórico precioso, buena gastronomía. Tarde tranquila o cena con vistas."
    contact: ""
    personal_note: "TODO — Enrique/Manuel"
    tarifa_specific: false
    tags: ["pueblo blanco"]

  - name: "Cádiz capital"
    category: day_trips
    area: "1h 15min en coche al noroeste"
    description: "Casco histórico, playa de la Caleta, mercado central. Día gastronómico fácil."
    contact: ""
    personal_note: ""
    tarifa_specific: false

  - name: "Gibraltar"
    category: day_trips
    area: "45 min en coche al este"
    description: "Cruzar la frontera con pasaporte o DNI. Subir al peñón en teleférico, los monos, la cueva de San Miguel. Medio día suficiente."
    contact: ""
    personal_note: ""
    tarifa_specific: false
    tags: ["frontera", "monos"]

