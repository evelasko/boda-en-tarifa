# Tarifa Concierge Guide
#
# Curated knowledge Thora uses to recommend things to do for guests
# arriving early or exploring the area. Source-of-truth for the
# `lookup_tarifa_guide` tool (see 07-knowledge-base.md).
#
# FORMAT — each item is a dict with:
#   name             : short display name (string)
#   category         : one of [beaches, restaurants, kite_wind, water,
#                              sightseeing, day_trips, whale_watching,
#                              walking, nightlife, family]
#   area             : rough location ("Tarifa town", "Bolonia", etc.)
#   description      : 1-2 lines, factual, no marketing fluff
#   contact          : optional — phone / web / reservation hint
#   personal_note    : optional — Thora may quote ("mi humano Manuel dice...")
#   tarifa_specific  : bool — true if Tarifa-area, false for day trips
#   tags             : optional array of free-form tags for filtering
#
# OPERATOR FILL-IN — items marked "TODO" need Enrique/Manuel to complete.

version: 1
last_updated: "TODO"

# =============================================================================
# Beaches
# =============================================================================
beaches:
  - name: "Valdevaqueros"
    category: beaches
    area: "5-10 min en coche al norte de Tarifa"
    description: "Playa muy ancha, dunas espectaculares al final. Famosa para kite y
      windsurf. En días de Levante fuerte se llena de viento y arena."
    contact: ""
    personal_note: "es la playa mas cool de todas, se conecta con punta paloma que
      es un poco más familiar, pero en valdevaqueros conviven en armonía
      kiteboarders y bañistas. Los chiringuitos Tangana y Bora son lo más, y
      tienen muy buen vibe con muy buena música"
    tarifa_specific: true
    tags: [ "kite", "windsurf", "ancha", "ventosa" ]

  - name: "Bolonia"
    category: beaches
    area: "20 min en coche al norte"
    description: "Cala con dunas enormes y las ruinas romanas de Baelo Claudia justo
      al lado. Una de las playas más bonitas de España. Llegar pronto en
      verano."
    contact: ""
    personal_note: "es una playa muy tranquila y familiar, aunque el extremo
      izquierdo es un poco más movido porque tiene los chiringuitos, sobre todo
      el Volare que pone muy buena musica"
    tarifa_specific: false
    tags: [ "ruinas", "dunas", "imprescindible" ]

  - name: "Los Lances"
    category: beaches
    area: "junto a la urbanización de Tarifa"
    description: "La playa de la propia Tarifa. Buena para pasear, chiringuitos a
      tiro de piedra, accesible andando desde el centro y desde Tres Mares."
    contact: ""
    personal_note: "TODO — Enrique/Manuel"
    tarifa_specific: true
    tags: [ "accesible", "chiringuitos", "urbana" ]

  - name: "Punta Paloma"
    category: beaches
    area: "10 min en coche al norte de Tarifa"
    description: "Cala más recogida que Valdevaqueros, fondos de arena fina. Famosa
      por la 'arcilla' natural — la gente se la pone en la piel a modo de spa
      improvisado."
    contact: ""
    personal_note: "TODO — Enrique/Manuel"
    tarifa_specific: true
    tags: [ "recogida", "arcilla", "fotogénica" ]

# =============================================================================
# Restaurants — operator to fill substantively
# =============================================================================
restaurants:
  # Suggested categories to cover when filling:
  #   - best paella
  #   - best fish / pescaíto frito
  #   - best tapas
  #   - best breakfast
  #   - best cocktail spot
  #   - best chiringuito
  #   - splurge spot
  #   - family-friendly
  #   - vegetarian-friendly
  - name: "Raizes"
    category: best restaurant
    area: "Tarifa Pueblo"
    description: "Cocina fusión para compartir, con carta estacional que rota y opciones
      vegetarianas/veganas. Rango habitual ~30-40 EUR por persona."
    contact: ""
    personal_note: "un poco caro pero merece mucho la pena, es toda una experiencia.
      Cambian el menú cada tres meses y cada vez se superan. Los platos son muy
      sofisticados y son un placer para el paladar. Además la atención es de las
      mejores de Tarifa, aunque a veces los camareros se pasan explicando
      demasiado los platos."
    tarifa_specific: true
  - name: "El Ancla"
    category: best restaurant
    area: "Tarifa Pueblo"
    description: "Clásico de Tarifa especializado en pescado y marisco del Estrecho,
      comprado según lonja del día. Muy conocido por croquetas de choco y platos
      de atún; precio medio ~20-30 EUR."
    contact: ""
    personal_note: "de los más baratos con muy buena carta de productos y platos de
      la región. Es muy campechano y te hacen sentir como en un pueblo de España
      de verdad. El tataki de atún es lo más."
    tarifa_specific: true

# =============================================================================
# Kite & wind activities
# =============================================================================
kite_wind:
  - name: "Radikite Tarifa"
    category: kite_wind
    area: "Playa de Los Lances Norte"
    description: "Escuela oficial de kitesurf con cursos desde iniciación hasta
      avanzado (incluye freestyle/surfkite/hydrofoil). Precio orientativo: semi-privadas
      desde ~36 EUR/h y privadas desde ~65 EUR/h."
    contact: "https://radikitetarifa.com/en/ | +34 616 185 651 | info@radikitetarifa.com"
    personal_note: "si quieres algo muy cómodo para empezar, esta está literalmente
      a pie de playa en Los Lances y suele tener buen sistema de rescate."
    tarifa_specific: true
    tags: [ "kite", "lessons", "beginner-friendly", "los-lances" ]

  - name: "Kite Concept Tarifa (rental)"
    category: kite_wind
    area: "N-340 km 81 (Tarifa)"
    description: "Alquiler de material de kitesurf para riders autónomos (equipo
      completo, kite suelta o tabla). También tienen alquiler de surf/SUP."
    contact: "https://www.kiteconcepttarifa.com/en/rental.html | +34 610 993 531"
    tarifa_specific: true
    tags: [ "kite", "rental", "equipment" ]

  - name: "Wind & Water Experience"
    category: kite_wind
    area: "Los Lances / Valdevaqueros"
    description: "Escuela activa desde 1997 con clases de windsurf, wingfoil y
      también kitesurf según condiciones. Suelen mover spot según viento."
    contact: "https://windwaterexperience.com/en/"
    tarifa_specific: true
    tags: [ "windsurf", "wingfoil", "kite", "lessons" ]

# =============================================================================
# Other water activities
# =============================================================================
water:
  - name: "Go Dive Tarifa"
    category: water
    area: "Tarifa port"
    description: "Centro de buceo con salidas diarias, bautizos y cursos para todos
      los niveles, muy enfocado en zona del Estrecho e Isla de Tarifa."
    contact: "https://www.godivecadiz.com/en/go-dive-tarifa/ | +34 682 765 311 | info@godivecadiz.com"
    personal_note: "si quieres bautizo o inmersiones guiadas con enfoque tranquilo,
      es una opción sólida."
    tarifa_specific: true
    tags: [ "scuba", "dives", "courses", "snorkel" ]

  - name: "Paddle Fun Tarifa"
    category: water
    area: "Tarifa town / costa"
    description: "Cursos y alquiler de SUP (tablas hinchables), ideal para días sin
      viento. Precio orientativo: alquiler desde ~30 EUR/2h y curso desde ~50 EUR/2h."
    contact: "https://en.paddlefuntarifa.com/ | +34 661 094 260 | info@kitefuntarifa.com"
    tarifa_specific: true
    tags: [ "sup", "paddle", "rental", "lessons" ]

  - name: "Wind & Water Experience (surf)"
    category: water
    area: "Los Lances"
    description: "Clases de surf en grupos pequeños y opción de adaptar playa/horario
      a condiciones de mar y viento."
    contact: "https://windwaterexperience.com/en/"
    tarifa_specific: true
    tags: [ "surf", "lessons", "small-groups" ]

  - name: "YellowSub Tarifa"
    category: water
    area: "Tarifa harbor"
    description: "Centro de buceo en el puerto con dos barcos de salidas y material
      de alquiler para inmersiones alrededor de Isla de Tarifa."
    contact: "https://www.divingtarifa.com/"
    tarifa_specific: true
    tags: [ "scuba", "harbor", "boat-dives" ]

# =============================================================================
# Sightseeing
# =============================================================================
sightseeing:
  - name: "Castillo de Guzmán el Bueno"
    category: sightseeing
    area: "Tarifa old town"
    description: "Castillo medieval del siglo X, vistas al estrecho. Entrada de
      pago. Visita rápida (~1h)."
    contact: ""
    personal_note: "Un mirador muy bonito sobre el estrecho de Gibraltar. Se ve
      perfectamente la costa de Marruecos."
    tarifa_specific: true
    tags: [ "historia", "rápido" ]

  - name: "Mirador del Estrecho"
    category: sightseeing
    area: "10 min en coche al este, hacia Algeciras"
    description: "Mirador sobre el estrecho de Gibraltar. En días claros se ve
      perfectamente la costa de Marruecos."
    contact: ""
    personal_note: "Un mirador muy bonito sobre el estrecho de Gibraltar. Se ve
      perfectamente la costa de Marruecos."
    tarifa_specific: true
    tags: [ "vistas", "fotogénico" ]

  - name: "Baelo Claudia"
    category: sightseeing
    area: "Bolonia, 20 min en coche al norte"
    description: "Ruinas romanas espectaculares, junto a la playa de Bolonia.
      Entrada gratuita para ciudadanos UE. Visita 1.5–2h."
    contact: ""
    personal_note: "Ruinas romanas muy bonitas, junto a la playa de Bolonia. Es un
      lugar muy bonito y tranquilo para pasear."
    tarifa_specific: false
    tags: [ "ruinas", "histórico" ]

  - name: "Casco antiguo de Tarifa"
    category: sightseeing
    area: "Tarifa centro"
    description: "Callejear sin plan por el casco antiguo: Puerta de Jerez, plaza
      del Mesón, callejuelas blancas. Mejor al atardecer."
    contact: ""
    personal_note: "Un casco antiguo muy bonito, con calles empedradas y casas
      blancas. Es un paseo muy bonito y tranquilo pero te puedes perder
      fácilmente."
    tarifa_specific: true

# =============================================================================
# Day trips
# =============================================================================
day_trips:
  - name: "Tánger (ferry desde Tarifa)"
    category: day_trips
    area: "Marruecos, ferry desde el puerto de Tarifa"
    description: "Ferry rápido (35-45 min) FRS o Inter Shipping, salidas frecuentes.
      Pasaporte obligatorio. Visitar la kasbah, comer en el zoco. Día completo."
    contact: "frs.es / intershipping.com"
    personal_note: ""
    tarifa_specific: false
    tags: [ "frontera", "pasaporte" ]

  - name: "Vejer de la Frontera"
    category: day_trips
    area: "40 min en coche al norte"
    description: "Pueblo blanco encaramado en un cerro. Casco histórico precioso,
      buena gastronomía. Tarde tranquila o cena con vistas."
    personal_note: "Uno de los pueblos más bonitos de la provincia de Cádiz, con un
      casco histórico precioso y una buena gastronomía. Está encima de una
      montaña con unas vistas increíbles."
    tarifa_specific: false
    tags: [ "pueblo blanco" ]

  - name: "Cádiz capital"
    category: day_trips
    area: "1h 15min en coche al noroeste"
    description: "Casco histórico, playa de la Caleta, mercado central. Día
      gastronómico fácil."
    personal_note: "La capital de la provincia de Cádiz, con un casco histórico
      precioso y una buena gastronomía. Tiene un malecón muy parecido al de La
      Habana."
    tarifa_specific: false

  - name: "Gibraltar"
    category: day_trips
    area: "45 min en coche al este"
    description: "Cruzar la frontera con pasaporte o DNI. Subir al peñón en
      teleférico, los monos, la cueva de San Miguel. Medio día suficiente."
    personal_note: "La frontera más bonita de España, con un peñón de granito muy
      bonito y una buena gastronomía. Es como si estuvieras en inglaterra pero
      en españa."
    tarifa_specific: false
    tags: [ "frontera", "monos" ]

